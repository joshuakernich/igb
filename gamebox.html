	<!-- WebGL canvases keep their last frame, so the virtual box can copy them (core/gamebox.js) -->
	<script>
		(function () {
			const get = HTMLCanvasElement.prototype.getContext;
			HTMLCanvasElement.prototype.getContext = function (type, opts) {
				if (type === 'webgl' || type === 'webgl2') opts = Object.assign({}, opts, { preserveDrawingBuffer: true });
				return get.call(this, type, opts);
			};
		})();
	</script>

	<!-- A pause for the whole page (window.__pause(true/false)): the clock stops, animation
	     frames and timers hold, and on resume everything carries on from the same instant.
	     The storyboard uses it to run one gamebox at a time. -->
	<script>
		(function () {
			const realPerf = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window);
			const realTimeout = window.setTimeout.bind(window), realInterval = window.setInterval.bind(window);
			const RealDate = Date, epoch = RealDate.now() - realPerf();
			let paused = false, pausedAt = 0, lost = 0;
			const now = () => (paused ? pausedAt : realPerf()) - lost;
			performance.now = now;
			class PausableDate extends RealDate {
				constructor(...a) { if (a.length) super(...a); else super(epoch + now()); }
				static now() { return epoch + now(); }
			}
			window.Date = PausableDate;
			const heldFrames = [], heldCalls = [];
			window.requestAnimationFrame = (cb) => realRaf(() => { if (paused) heldFrames.push(cb); else cb(now()); });
			window.setTimeout = (fn, ms, ...a) => realTimeout(() => { if (paused) heldCalls.push(() => fn(...a)); else fn(...a); }, ms);
			window.setInterval = (fn, ms, ...a) => realInterval(() => { if (!paused) fn(...a); }, ms);
			window.__pause = function (on) {
				if (on && !paused) { pausedAt = realPerf(); paused = true; if (window.IGB && IGB.pauseAudio) IGB.pauseAudio(true); }
				else if (!on && paused) {
					lost += realPerf() - pausedAt; paused = false;
					if (window.IGB && IGB.pauseAudio) IGB.pauseAudio(false);
					for (const cb of heldFrames.splice(0)) realRaf(() => cb(now()));
					for (const fn of heldCalls.splice(0)) fn();
				}
				return paused;
			};
			window.__paused = () => paused;
		})();
	</script>

</head>
<body class="gamebox-page">
	<!-- the real game runs here, out of sight; its walls are copied into the room -->
	<gamebox-source><igb-world></igb-world></gamebox-source>

	<canvas id="room"></canvas>

	<gamebox-bar>
		<gamebox-title><b>Virtual Gamebox</b><span id="status">Loading…</span></gamebox-title>
		<gamebox-games id="games"></gamebox-games>
		<gamebox-tools>
			<label>Players <select id="count"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label>
			<button id="view" type="button">View: Outside</button>
		</gamebox-tools>
	</gamebox-bar>
</body>
</html>
