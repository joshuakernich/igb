<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
	<!-- Gaze Test: the UX Demo's blueprint (flat blue, drawn lines only: the grid, a square inset in it), an eye inset in that -->
