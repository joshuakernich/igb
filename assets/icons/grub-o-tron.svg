<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Fission Chips: a cone of glowing chips in neon tubes, an atom round them, the cone dripping -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#4a0a6a"/>
      <stop offset="1" stop-color="#200033"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8106a"/>
      <stop offset="0.45" stop-color="#FC1992"/>
      <stop offset="1" stop-color="#a00a58"/>
    </linearGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <rect x="9" y="9" width="238" height="238" rx="37" fill="none" stroke="#9E00FF" stroke-width="5"/>

  <!-- the atom's orbits, neon tubes behind the chips -->
  <g fill="none" filter="url(#neon)" stroke-linecap="round">
    <g stroke="#3cff7a" stroke-width="6" opacity="0.9">
      <ellipse cx="128" cy="96" rx="96" ry="30" transform="rotate(-24 128 96)"/>
      <ellipse cx="128" cy="96" rx="96" ry="30" transform="rotate(24 128 96)"/>
    </g>
    <g stroke="#eaffd0" stroke-width="2">
      <ellipse cx="128" cy="96" rx="96" ry="30" transform="rotate(-24 128 96)"/>
      <ellipse cx="128" cy="96" rx="96" ry="30" transform="rotate(24 128 96)"/>
    </g>
  </g>
  <circle cx="44" cy="61" r="7" fill="#FC1992" filter="url(#soft)"/>
  <circle cx="214" cy="132" r="6" fill="#e9ff4a" filter="url(#soft)"/>

  <!-- the chips: toxic-green neon tubes, a pale core in each -->
  <g stroke-linecap="round" filter="url(#neon)">
    <g stroke="#9dff3a" stroke-width="15">
      <line x1="84" y1="132" x2="70" y2="56"/>
      <line x1="104" y1="128" x2="100" y2="40"/>
      <line x1="126" y1="126" x2="130" y2="30"/>
      <line x1="148" y1="128" x2="160" y2="44"/>
      <line x1="168" y1="132" x2="188" y2="62"/>
    </g>
    <g stroke="#f4ffd8" stroke-width="4">
      <line x1="84" y1="128" x2="72" y2="60"/>
      <line x1="104" y1="124" x2="101" y2="44"/>
      <line x1="126" y1="122" x2="129" y2="34"/>
      <line x1="148" y1="124" x2="158" y2="48"/>
      <line x1="168" y1="128" x2="185" y2="66"/>
    </g>
  </g>

  <!-- the cone, dripping, with a radiation sign on it -->
  <path d="M60 124 L196 124 L170 206 Q166 214 158 214 L98 214 Q90 214 86 206 Z" fill="url(#cone)" stroke="#2a0a3a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M60 124 L196 124 L192 138 L64 138 Z" fill="#ff7ab8" opacity="0.7"/>
  <g fill="#FC1992" stroke="#2a0a3a" stroke-width="4" stroke-linejoin="round">
    <path d="M104 212 Q104 236 110 236 Q116 236 116 212 Z"/>
    <path d="M138 212 Q138 228 143 228 Q148 228 148 212 Z"/>
  </g>
  <circle cx="110" cy="232" r="2.5" fill="#ffd0e8"/>
  <g transform="translate(128 170)">
    <circle r="27" fill="#e9ff4a" stroke="#2a0a3a" stroke-width="4"/>
    <g fill="#2a0a3a">
      <path d="M0 0 L-9 -15.6 A18 18 0 0 1 9 -15.6 Z"/>
      <path d="M0 0 L-9 -15.6 A18 18 0 0 1 9 -15.6 Z" transform="rotate(120)"/>
      <path d="M0 0 L-9 -15.6 A18 18 0 0 1 9 -15.6 Z" transform="rotate(240)"/>
      <circle r="4.5"/>
    </g>
    <circle r="7" fill="none" stroke="#e9ff4a" stroke-width="2.5"/>
  </g>
</svg>
