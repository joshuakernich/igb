<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
	<!-- Twin Tail Tower: a sky from blue to sunset, three floating platforms climbing it, and an orange fox's head with its two tails over the top one -->
