		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a2a7a"/>
			<stop offset="0.45" stop-color="#ff8a5c"/>
			<stop offset="1" stop-color="#5fb8ff"/>
		</linearGradient>
	</defs>
	<rect width="256" height="256" rx="40" fill="url(#sky)"/>
	<circle cx="200" cy="44" r="4" fill="white"/>
	<circle cx="56" cy="30" r="3" fill="white"/>
	<circle cx="150" cy="22" r="2.5" fill="white"/>
	<g stroke="#1a1030" stroke-width="6" stroke-linejoin="round">
		<rect x="22" y="206" width="92" height="22" rx="11" fill="#5fd35a"/>
		<rect x="150" y="164" width="84" height="22" rx="11" fill="#5fe0ff"/>
		<rect x="70" y="122" width="96" height="22" rx="11" fill="#ffc66b"/>
		<!-- the tails -->
		<path d="M118 112 C 84 104 70 76 82 56 C 96 72 108 86 124 98 Z" fill="#ff9a2b"/>
		<path d="M82 56 C 78 66 80 74 86 80 C 90 70 88 62 82 56 Z" fill="#fff4e2"/>
		<path d="M138 112 C 172 104 186 76 174 56 C 160 72 148 86 132 98 Z" fill="#ff9a2b"/>
		<path d="M174 56 C 178 66 176 74 170 80 C 166 70 168 62 174 56 Z" fill="#fff4e2"/>
		<!-- the head -->
		<path d="M100 66 L 106 30 L 124 56 Z" fill="#ff9a2b"/>
		<path d="M156 66 L 150 30 L 132 56 Z" fill="#ff9a2b"/>
		<circle cx="128" cy="84" r="34" fill="#ff9a2b"/>
		<path d="M100 92 C 108 116 148 116 156 92 C 146 100 110 100 100 92 Z" fill="#fff4e2"/>
	</g>
	<circle cx="116" cy="80" r="7" fill="#15131c"/>
	<circle cx="140" cy="80" r="7" fill="#15131c"/>
	<circle cx="118" cy="77" r="2.4" fill="white"/>
	<circle cx="142" cy="77" r="2.4" fill="white"/>
	<ellipse cx="128" cy="98" rx="5" ry="4" fill="#15131c"/>
</svg>
