<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
	<!-- UX Demo: a blueprint, flat blue, drawn lines only: the grid, a square inset in it, a play button inset in that -->
	<defs>
		<pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
			<path d="M32 0 H0 V32" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>
		</pattern>
	</defs>
	<rect width="256" height="256" rx="40" fill="#1f5fd0"/>
	<rect width="256" height="256" rx="40" fill="url(#grid)"/>
	<g fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
		<rect x="64" y="64" width="128" height="128" rx="10"/>
		<path d="M108 92 L156 128 L108 164 Z"/>
	</g>
</svg>
