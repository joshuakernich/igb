<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>IGB Prototypes</title>

	<!-- fonts used by the HUD and games -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Knewave&family=Paytone+One&family=Playwrite+DK+Loopet:wght@100..400&family=Rubik:ital,wght@0,300..900;1,300..900&family=Share+Tech+Mono&family=Lexend:wght@500&family=Black+Han+Sans&family=Luckiest+Guy&family=Lobster&family=Chewy&family=VT323&family=Bangers&family=Orbitron:wght@800&display=swap">

	<!-- stylesheets -->
	<link rel="stylesheet" href="core/launcher.css">
	<link rel="stylesheet" href="core/stage.css">
	<link rel="stylesheet" href="shared/meep.css">
	<link rel="stylesheet" href="shared/hud.css">
	<link rel="stylesheet" href="shared/tally.css">
	<link rel="stylesheet" href="shared/cube.css">

	<!-- libraries -->
	<script src="lib/jquery.min.js"></script>
	<script src="lib/jquery-ui.min.js"></script>

	<!-- core -->
	<script src="core/igb.js"></script>
	<script src="core/stage.js"></script>
	<script src="core/art.js"></script>
	<script src="core/players.js"></script>

	<!-- shared components, available to every game -->
	<script src="shared/util.js"></script>
	<script src="shared/sfx.js"></script>
	<script src="shared/audio.js"></script>
	<script src="shared/meep.js"></script>
	<script src="shared/hud.js"></script>
	<script src="shared/showtime.js"></script>
	<script src="shared/tally.js"></script>
	<script src="shared/cube.js"></script>
	<script src="shared/shapes.js"></script>

	<!-- the list of prototypes; each game's own file loads when it starts -->
	<script src="games/manifest.js"></script>
	<script src="core/launcher.js"></script>
	<script type="module" src="core/home-bg.js"></script>
</head>
<body>
	<igb>
		<igb-world>
			<igb-menu></igb-menu>
		</igb-world>
		<igb-controls>
			<button btn=home title="Menu">⌂</button>
			<button btn=refresh title="Restart">↺</button>
		</igb-controls>
		<igb-log>LOADING...</igb-log>
	</igb>
	<igb-simulator></igb-simulator>
</body>
</html>
