<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>IGB Prototypes</title>

	<!-- fonts used by the HUD and games -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Knewave&family=Paytone+One&family=Playwrite+DK+Loopet:wght@100..400&family=Rubik:ital,wght@0,300..900;1,300..900&family=Share+Tech+Mono&family=Shrikhand&family=Monoton&family=Rubik+Wet+Paint&family=Lexend:wght@500&display=swap">

	<!-- stylesheets -->
	<link rel="stylesheet" href="core/launcher.css">
	<link rel="stylesheet" href="core/stage.css">
	<link rel="stylesheet" href="shared/meep.css">
	<link rel="stylesheet" href="shared/hud.css">
	<link rel="stylesheet" href="shared/tally.css">
	<link rel="stylesheet" href="shared/cube.css">

	<!-- libraries -->
	<script src="lib/jquery.min.js"></script>
	<script src="lib/jquery-ui.min.js"></script>

	<!-- core -->
	<script src="core/igb.js"></script>
	<script src="core/stage.js"></script>
	<script src="core/art.js"></script>
	<script src="core/players.js"></script>

	<!-- shared components, available to every game -->
	<script src="shared/util.js"></script>
	<script src="shared/sfx.js"></script>
	<script src="shared/audio.js"></script>
	<script src="shared/meep.js"></script>
	<script src="shared/hud.js"></script>
	<script src="shared/showtime.js"></script>
	<script src="shared/tally.js"></script>
	<script src="shared/cube.js"></script>
	<script src="shared/shapes.js"></script>

	<!-- the list of prototypes; each game's own file loads when it starts -->
	<script src="games/manifest.js"></script>
	<script src="core/launcher.js"></script>
	<script type="module" src="core/home-bg.js"></script>
</head>
<body>
	<igb>
		<igb-world>
			<igb-menu></igb-menu>
		</igb-world>
		<igb-controls>
			<button btn=home title="Menu"><svg viewBox="0 0 100 100"><path d="M50 22 L78 46 L70 46 L70 76 L56 76 L56 59 L44 59 L44 76 L30 76 L30 46 L22 46 Z" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg></button>
			<button btn=refresh title="Restart"><svg viewBox="0 0 100 100"><path d="M71 50 A21 21 0 1 1 64 34" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><path d="M57 21 L74 30 L60 43 Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round" stroke-width="4"/></svg></button>
			<button btn=debug title="Debug"><svg viewBox="0 0 100 100"><path d="M44 25 L37 14 M56 25 L63 14 M34 47 L20 40 M33 58 L18 58 M35 69 L22 78 M66 47 L80 40 M67 58 L82 58 M65 69 L78 78" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="33" r="10" fill="currentColor"/><ellipse cx="50" cy="59" rx="17" ry="21" fill="currentColor"/><rect x="48.5" y="42" width="3" height="36" fill="#000"/></svg></button>
		</igb-controls>
		<igb-log>LOADING...</igb-log>
	</igb>
	<igb-simulator></igb-simulator>
</body>
</html>
